<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 499.27560000000005 130"><rect width="100%" height="100%" fill="white"/><rect x="0" y="0.0" width="499.27560000000005" height="55.0" rx="3" fill="#edf4f8" stroke="#afc3d2"/><text x="14" y="20.0" text-anchor="start" font-size="9" font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334f" font-weight="700">重量</text><text x="249.63780000000003" y="42.9" text-anchor="middle" font-size="12" font-family="Microsoft YaHei,Arial,sans-serif" fill="#285f86">127000 + 250 × 104 + 2000 + 30000 − 500 = 184500 kg</text><rect x="0" y="65.0" width="499.27560000000005" height="55.0" rx="3" fill="#edf4f8" stroke="#afc3d2"/><text x="14" y="85.0" text-anchor="start" font-size="9" font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334f" font-weight="700">参考插值</text><text x="249.63780000000003" y="107.9" text-anchor="middle" font-size="12" font-family="Microsoft YaHei,Arial,sans-serif" fill="#285f86">149 + (184500 − 180000) / 10000 × 4 = 150.8 kt</text></svg>