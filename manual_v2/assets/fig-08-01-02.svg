<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 499.27560000000005 130"><rect width="100%" height="100%" fill="white"/><rect x="0" y="0.0" width="499.27560000000005" height="33.333333333333336" rx="3" fill="#edf4f8" stroke="#afc3d2"/><text x="14" y="20.0" text-anchor="start" font-size="9" font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334f" font-weight="700">地理距离</text><text x="249.63780000000003" y="28.6" text-anchor="middle" font-size="12" font-family="Microsoft YaHei,Arial,sans-serif" fill="#285f86">Dtotal = distance(departure, arrival)</text><rect x="0" y="43.333333333333336" width="499.27560000000005" height="33.333333333333336" rx="3" fill="#edf4f8" stroke="#afc3d2"/><text x="14" y="63.333333333333336" text-anchor="start" font-size="9" font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334f" font-weight="700">剩余距离</text><text x="249.63780000000003" y="71.93333333333334" text-anchor="middle" font-size="12" font-family="Microsoft YaHei,Arial,sans-serif" fill="#285f86">Dremain = distance(position, arrival)</text><rect x="0" y="86.66666666666667" width="499.27560000000005" height="33.333333333333336" rx="3" fill="#edf4f8" stroke="#afc3d2"/><text x="14" y="106.66666666666667" text-anchor="start" font-size="9" font-family="Microsoft YaHei,Arial,sans-serif" fill="#17334f" font-weight="700">显示进度</text><text x="249.63780000000003" y="115.26666666666668" text-anchor="middle" font-size="12" font-family="Microsoft YaHei,Arial,sans-serif" fill="#285f86">progress = max(0, (Dtotal - Dremain) / Dtotal × 100)</text></svg>